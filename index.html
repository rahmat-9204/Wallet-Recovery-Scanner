<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallet Balance Scanner</title>

<style>
body {
    font-family: Arial;
    background: #f1f4f9;
    color: #172033;
    padding: 15px;
}
main {
    max-width: 750px;
    margin: auto;
    background: white;
    padding: 18px;
    border-radius: 14px;
}
h2 {color:#1556b8}

input,button {
    width:100%;
    box-sizing:border-box;
    padding:12px;
    margin:7px 0;
    border-radius:8px;
    font-size:15px;
}
input {
    border:1px solid #ccd3df;
}
button {
    border:0;
    background:#1556b8;
    color:white;
    font-weight:bold;
}
.clear {background:#555}
.status {
    background:#edf2fa;
    padding:12px;
    border-radius:8px;
    white-space:pre-wrap;
}
.result {
    background:#f8f9fc;
    border:1px solid #16834a;
    padding:12px;
    border-radius:8px;
    margin-top:10px;
    direction:ltr;
    text-align:left;
    overflow-wrap:anywhere;
}
</style>
</head>

<body>

<main>

<h2>Wallet Balance Scanner</h2>

<h3>آدرس‌های عمومی کیف پول</h3>

<label>Bitcoin</label>
<input id="btc" placeholder="BTC Address">

<label>Ethereum</label>
<input id="eth" placeholder="ETH Address">

<label>BNB Smart Chain</label>
<input id="bnb" placeholder="BNB Address">

<label>TRON</label>
<input id="tron" placeholder="TRON Address">

<button id="start">بررسی موجودی</button>

<button id="clear" class="clear">
پاک کردن تاریخچه
</button>

<button id="csv">
دانلود گزارش CSV
</button>

<h3>وضعیت</h3>

<div id="status" class="status">
آماده بررسی
</div>

<h3>تاریخچه دارایی‌های مثبت</h3>

<div id="results"></div>

</main>

<script>

const $ = id => document.getElementById(id);

let history=[];

try {
    history=JSON.parse(
        localStorage.getItem("wallet_history") || "[]"
    );
} catch {
    history=[];
}

function save(){
    localStorage.setItem(
        "wallet_history",
        JSON.stringify(history)
    );
}

function render(){

    $("results").innerHTML="";

    history.slice().reverse().forEach(item=>{

        const box=document.createElement("div");
        box.className="result";

        const title=document.createElement("h3");

        title.textContent="دارایی مثبت پیدا شد";

        box.appendChild(title);

        const info=[
            "شبکه: "+item.network,
            "آدرس: "+item.address,
            "موجودی: "+item.balance,
            "تاریخ: "+item.date
        ];

        info.forEach(value=>{

            const p=document.createElement("p");

            p.textContent=value;

            box.appendChild(p);

        });

        $("results").appendChild(box);

    });

}

async function getJSON(url){

    const controller=new AbortController();

    const timer=setTimeout(
        ()=>controller.abort(),
        20000
    );

    try{

        const response=await fetch(url,{
            signal:controller.signal
        });

        if(!response.ok){
            throw new Error("HTTP "+response.status);
        }

        return await response.json();

    }finally{

        clearTimeout(timer);

    }

}

function formatAmount(raw,decimals){

    const value=BigInt(raw);

    const base=10n ** BigInt(decimals);

    const whole=value/base;

    const fraction=value%base;

    const decimal=fraction
        .toString()
        .padStart(decimals,"0")
        .replace(/0+$/,"");

    return decimal
        ? whole.toString()+"."+decimal
        : whole.toString();

}


// BITCOIN

async function checkBTC(address){

    const data=await getJSON(
        "https://blockstream.info/api/address/"+
        encodeURIComponent(address)
    );

    const balance=
        data.chain_stats.funded_txo_sum-
        data.chain_stats.spent_txo_sum+
        data.mempool_stats.funded_txo_sum-
        data.mempool_stats.spent_txo_sum;

    return [{
        amount:balance/100000000,
        unit:"BTC"
    }];

}


// EVM RPC

async function rpcCall(rpc,method,params){

    const response=await fetch(rpc,{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            jsonrpc:"2.0",
            method:method,
            params:params,
            id:1
        })
    });

    if(!response.ok){
        throw new Error("RPC HTTP "+response.status);
    }

    const data=await response.json();

    if(data.error || !data.result){
        throw new Error("RPC response error");
    }

    return data.result;

}


// ETH + BNB NATIVE AND USDT

async function checkEVM(address,network){

    const config={

        ETH:{
            rpc:"https://ethereum-rpc.publicnode.com",
            usdt:"0xdAC17F958D2ee523a2206206994597C13D831ec7",
            decimals:6
        },

        BNB:{
            rpc:"https://bsc-rpc.publicnode.com",
            usdt:"0x55d398326f99059fF775485246999027B3197955",
            decimals:18
        }

    };

    const cfg=config[network];

    const results=[];

    // Native balance

    const native=await rpcCall(
        cfg.rpc,
        "eth_getBalance",
        [address,"latest"]
    );

    const nativeAmount=formatAmount(
        BigInt(native).toString(),
        18
    );

    results.push({
        amount:nativeAmount,
        unit:network
    });

    // USDT balance

    const cleanAddress=address
        .toLowerCase()
        .replace("0x","");

    if(!/^[0-9a-f]{40}$/.test(cleanAddress)){
        throw new Error("Invalid address");
    }

    const data="0x70a08231"+
        cleanAddress.padStart(64,"0");

    const tokenBalance=await rpcCall(
        cfg.rpc,
        "eth_call",
        [{
            to:cfg.usdt,
            data:data
        },"latest"]
    );

    const amount=formatAmount(
        BigInt(tokenBalance).toString(),
        cfg.decimals
    );

    results.push({
        amount:amount,
        unit:"USDT"
    });

    return results;

}


// TRON + TRC20 USDT

async function checkTRON(address){

    const data=await getJSON(
        "https://api.trongrid.io/v1/accounts/"+
        encodeURIComponent(address)
    );

    const account=data.data?.[0];

    const results=[];

    // Native TRX

    const trx=account
        ? Number(account.balance||0)/1000000
        : 0;

    results.push({
        amount:trx,
        unit:"TRX"
    });

    // TRC20 USDT

    const USDT_CONTRACT=
        "TXLAQ63Xg1NAzckPwKHvzw7CSEmLMEqcdj";

    if(account && Array.isArray(account.trc20)){

        for(const token of account.trc20){

            if(token[USDT_CONTRACT]!==undefined){

                const amount=formatAmount(
                    token[USDT_CONTRACT],
                    6
                );

                results.push({
                    amount:amount,
                    unit:"USDT"
                });

            }

        }

    }

    return results;

}


// SAVE POSITIVE RESULTS

function addResult(network,address,balance){

    if(Number(balance.amount)<=0)return;

    const item={

        network:network+" - "+balance.unit,

        address:address,

        balance:balance.amount+" "+balance.unit,

        date:new Date().toLocaleString()

    };

    const exists=history.some(x=>
        x.network===item.network &&
        x.address===item.address &&
        x.balance===item.balance
    );

    if(!exists){

        history.push(item);

        save();

        render();

    }

}


// MAIN SCANNER

async function run(){

    const addresses={

        BTC:$("btc").value.trim(),

        ETH:$("eth").value.trim(),

        BNB:$("bnb").value.trim(),

        TRON:$("tron").value.trim()

    };

    if(!Object.values(addresses).some(Boolean)){

        $("status").textContent=
            "حداقل یک آدرس عمومی وارد کن.";

        return;

    }

    const tasks=[

        ["BTC",addresses.BTC,checkBTC],

        ["ETH",addresses.ETH,
            a=>checkEVM(a,"ETH")],

        ["BNB",addresses.BNB,
            a=>checkEVM(a,"BNB")],

        ["TRON",addresses.TRON,checkTRON]

    ];

    let checked=0;

    let found=0;

    $("start").disabled=true;

    $("status").textContent=
        "بررسی موجودی شروع شد...";

    for(const [network,address,fn] of tasks){

        if(!address)continue;

        $("status").textContent=
            "در حال بررسی شبکه "+network+"...";

        try{

            const balances=await fn(address);

            checked++;

            for(const balance of balances){

                if(Number(balance.amount)>0){

                    addResult(
                        network,
                        address,
                        balance
                    );

                    found++;

                }

            }

        }catch(error){

            console.error(network,error);

            $("status").textContent+=
                "\nخطا در "+network+": "+error.message;

        }

    }

    $("status").textContent+=
        "\n\nشبکه‌های بررسی‌شده: "+checked+
        "\nدارایی‌های مثبت: "+found+
        "\n\nبررسی پایان یافت.";

    $("start").disabled=false;

}


// CLEAR HISTORY

$("clear").onclick=()=>{

    if(confirm("تمام تاریخچه پاک شود؟")){

        history=[];

        save();

        render();

        $("status").textContent=
            "تاریخچه پاک شد.";

    }

};


// CSV EXPORT

$("csv").onclick=()=>{

    const rows=[

        ["Network","Address","Balance","Date"]

    ];

    history.forEach(x=>{

        rows.push([

            x.network,
            x.address,
            x.balance,
            x.date

        ]);

    });

    const csv=rows.map(row=>

        row.map(v=>

            '"'+String(v).replaceAll('"','""')+'"'

        ).join(",")

    ).join("\n");

    const blob=new Blob(

        ["\ufeff"+csv],

        {type:"text/csv;charset=utf-8"}

    );

    const url=URL.createObjectURL(blob);

    const a=document.createElement("a");

    a.href=url;

    a.download="wallet-history.csv";

    a.click();

    setTimeout(
        ()=>URL.revokeObjectURL(url),
        1000
    );

};


$("start").onclick=run;

render();

</script>

</body>
</html>
