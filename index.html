<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallet Balance Checker</title>
<style>
body{font-family:Arial;background:#101827;color:white;padding:15px}
.box{max-width:650px;margin:auto;background:#1d293b;padding:20px;border-radius:12px}
h2{text-align:center}
label{display:block;margin-top:14px}
input,button{width:100%;padding:12px;margin-top:7px;box-sizing:border-box;border-radius:7px;border:0}
input{background:#fff;color:#111}
button{background:#16a085;color:white;font-weight:bold;font-size:16px}
button:disabled{opacity:.5}
#status{margin:15px 0;color:#f1c40f}
.result{background:#26364c;padding:12px;margin:10px 0;border-radius:8px;direction:ltr;overflow-wrap:anywhere}
.green{color:#2ecc71}
.red{color:#ff7675}
small{color:#bdc3c7}
</style>
</head>
<body>

<div class="box">
<h2>💰 Multi Network Wallet Checker</h2>

<label>Bitcoin Address</label>
<input id="btc" placeholder="BTC public address">

<label>Ethereum Address</label>
<input id="eth" placeholder="0x...">

<label>BNB Smart Chain Address</label>
<input id="bnb" placeholder="0x...">

<label>TRON Address</label>
<input id="tron" placeholder="T...">

<button id="start" onclick="startCheck()">شروع بررسی موجودی</button>

<div id="status">آماده بررسی</div>
<div id="results"></div>

<button onclick="downloadCSV()">دانلود نتایج CSV</button>
</div>

<script>
const results = [];

function showStatus(text){
 document.getElementById("status").textContent=text;
}

function addResult(network,address,asset,balance){
 if(Number(balance)<=0) return;

 const item={network,address,asset,balance};
 results.push(item);

 const div=document.createElement("div");
 div.className="result";
 div.innerHTML=`
 <b class="green">موجودی پیدا شد!</b><br>
 Network: ${network}<br>
 Asset: ${asset}<br>
 Balance: ${balance}<br>
 Address: ${address}
 `;
 document.getElementById("results").appendChild(div);
}

async function getJSON(url,options={}){
 const response=await fetch(url,options);
 if(!response.ok) throw new Error("HTTP "+response.status);
 return await response.json();
}

async function checkBTC(address){
 const data=await getJSON(
 "https://blockstream.info/api/address/"+encodeURIComponent(address)
 );

 const funded=
 (data.chain_stats?.funded_txo_sum||0)+
 (data.mempool_stats?.funded_txo_sum||0);

 const spent=
 (data.chain_stats?.spent_txo_sum||0)+
 (data.mempool_stats?.spent_txo_sum||0);

 const balance=(funded-spent)/100000000;
 addResult("Bitcoin","BTC", "BTC",balance);
}

async function checkEVM(address,network,rpc,contract,decimals){
 const balanceData=await getJSON(rpc,{
 method:"POST",
 headers:{"Content-Type":"application/json"},
 body:JSON.stringify({
 jsonrpc:"2.0",
 id:1,
 method:"eth_getBalance",
 params:[address,"latest"]
 })
 });

 if(balanceData.error) throw new Error("Native balance API error");

 const native=Number(BigInt(balanceData.result))/1e18;
 addResult(network,address,network==="Ethereum"?"ETH":"BNB",native);

 const padded=address.toLowerCase().replace("0x","");
 const callData="0x70a08231"+"000000000000000000000000"+padded;

 const tokenData=await getJSON(rpc,{
 method:"POST",
 headers:{"Content-Type":"application/json"},
 body:JSON.stringify({
 jsonrpc:"2.0",
 id:2,
 method:"eth_call",
 params:[{to:contract,data:callData},"latest"]
 })
 });

 if(tokenData.error) throw new Error("USDT API error");

 const tokenBalance=Number(BigInt(tokenData.result))/Math.pow(10,decimals);
 addResult(network,address,"USDT",tokenBalance);
}

async function checkTRON(address){
 const data=await getJSON(
 "https://api.trongrid.io/v1/accounts/"+encodeURIComponent(address)
 );

 const account=data.data?.[0];
 if(!account) return;

 const trx=(account.balance||0)/1000000;
 addResult("TRON",address,"TRX",trx);

 const tokenData=await getJSON(
 "https://api.trongrid.io/v1/accounts/"+encodeURIComponent(address)+"/tokens?limit=200&contract_address=TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t"
 );

 for(const token of (tokenData.data||[])){
  if(token.tokenId==="TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t"){
   const usdt=Number(token.balance)/1000000;
   addResult("TRON",address,"USDT",usdt);
  }
 }
}

async function runTask(name,fn){
 try{
  showStatus("در حال بررسی "+name+" ...");
  await fn();
 }catch(e){
  console.error(name,e);
  showStatus("خطا در "+name+": "+e.message);
 }
}

async function startCheck(){
 const button=document.getElementById("start");
 button.disabled=true;
 results.length=0;
 document.getElementById("results").innerHTML="";

 const btc=document.getElementById("btc").value.trim();
 const eth=document.getElementById("eth").value.trim();
 const bnb=document.getElementById("bnb").value.trim();
 const tron=document.getElementById("tron").value.trim();

 try{
  if(btc) await runTask("Bitcoin",()=>checkBTC(btc));

  if(eth) await runTask("Ethereum",()=>checkEVM(
   eth,
   "Ethereum",
   "https://ethereum-rpc.publicnode.com",
   "0xdAC17F958D2ee523a2206206994597C13D831ec7",
   6
  ));

  if(bnb) await runTask("BNB",()=>checkEVM(
   bnb,
   "BNB Smart Chain",
   "https://bsc-rpc.publicnode.com",
   "0x55d398326f99059fF775485246999027B3197955",
   18
  ));

  if(tron) await runTask("TRON",()=>checkTRON(tron));

  showStatus("بررسی تمام شد. نتایج مثبت: "+results.length);
 }finally{
  button.disabled=false;
 }
}

function downloadCSV(){
 if(!results.length){
  alert("نتیجه مثبتی برای دانلود وجود ندارد");
  return;
 }

 let csv="Network,Address,Asset,Balance\n";
 results.forEach(x=>{
  csv+=`${x.network},${x.address},${x.asset},${x.balance}\n`;
 });

 const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="wallet-results.csv";
 a.click();
 URL.revokeObjectURL(url);
}
</script>
</body>
</html>
