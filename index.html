<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USDT Wallet Scanner</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    background: #101827;
    color: white;
    font-family: Tahoma, Arial, sans-serif;
}

.container {
    max-width: 650px;
    margin: auto;
}

h1 {
    text-align: center;
    color: #32d6a0;
    font-size: 25px;
}

.card {
    background: #1c293b;
    border: 1px solid #34465e;
    border-radius: 13px;
    padding: 18px;
    margin-bottom: 16px;
}

h2 {
    color: #32d6a0;
    font-size: 18px;
    margin-top: 0;
}

label {
    display: block;
    margin: 14px 0 7px;
}

input {
    width: 100%;
    padding: 13px;
    background: #101827;
    border: 1px solid #52657e;
    border-radius: 8px;
    color: white;
    font-size: 14px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border: 0;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
}

.start {
    background: #13b981;
    color: white;
}

.csv {
    background: #2879d0;
    color: white;
}

.clear {
    background: #bd3948;
    color: white;
}

.status {
    background: #101827;
    padding: 13px;
    border-radius: 8px;
    line-height: 2;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.result {
    background: #101827;
    border-right: 4px solid #13b981;
    padding: 13px;
    margin-top: 10px;
    border-radius: 8px;
    line-height: 2;
    overflow-wrap: anywhere;
}

.result strong {
    color: #32d6a0;
}

.small {
    color: #aebed0;
    font-size: 12px;
    line-height: 2;
}

</style>
</head>

<body>

<div class="container">

<h1>USDT Wallet Scanner</h1>

<div class="card">

<h2>آدرس‌های عمومی کیف پول</h2>

<label>TRON - TRC20</label>
<input id="tron" dir="ltr"
placeholder="آدرس عمومی ترون">

<label>BNB Smart Chain - BEP20</label>
<input id="bnb" dir="ltr"
placeholder="0x...">

<label>Ethereum - ERC20</label>
<input id="eth" dir="ltr"
placeholder="0x...">

<label>TronGrid API Key (اختیاری)</label>
<input id="tronKey" dir="ltr"
placeholder="API Key در صورت داشتن">

<button class="start" id="scanBtn">
شروع بررسی موجودی USDT
</button>

<button class="csv" id="csvBtn">
دانلود گزارش CSV
</button>

<button class="clear" id="clearBtn">
پاک کردن تاریخچه
</button>

<p class="small">
این برنامه فقط موجودی تتر را بررسی می‌کند.
آدرس‌های عمومی را وارد کنید؛ عبارت بازیابی و کلید خصوصی را وارد نکنید.
</p>

</div>

<div class="card">

<h2>وضعیت بررسی</h2>

<div class="status" id="status">
آماده بررسی
</div>

</div>

<div class="card">

<h2>تاریخچه دارایی‌های مثبت</h2>

<div id="history">
هنوز دارایی مثبتی ثبت نشده است.
</div>

</div>

</div>

<script>

"use strict";

/* قراردادهای USDT */

const CONTRACTS = {

ETH:
"0xdAC17F958D2ee523a2206206994597C13D831ec7",

BNB:
"0x55d398326f99059fF775485246999027B3197955",

TRON:
"TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t"

};

/* RPC شبکه‌ها */

const RPC = {

ETH:
"https://ethereum-rpc.publicnode.com",

BNB:
"https://bsc-rpc.publicnode.com"

};

const STORAGE = "usdt_scanner_history";

let historyData = [];

try {
    historyData = JSON.parse(
        localStorage.getItem(STORAGE) || "[]"
    );

    if (!Array.isArray(historyData)) {
        historyData = [];
    }

} catch(e) {
    historyData = [];
}

/* وضعیت */

function setStatus(text) {

    document.getElementById("status").textContent = text;

}

/* ذخیره موجودی مثبت */

function savePositive(network, address, balance) {

    if (!Number.isFinite(balance) || balance <= 0) {
        return;
    }

    const item = {

        network: network,

        asset: "USDT",

        balance: balance.toString(),

        address: address,

        date: new Date().toLocaleString()

    };

    const exists = historyData.some(x =>
        x.network === item.network &&
        x.address.toLowerCase() === item.address.toLowerCase() &&
        x.balance === item.balance
    );

    if (!exists) {

        historyData.unshift(item);

        historyData = historyData.slice(0, 500);

        localStorage.setItem(
            STORAGE,
            JSON.stringify(historyData)
        );

    }

    renderHistory();

}

/* نمایش تاریخچه */

function renderHistory() {

    const box = document.getElementById("history");

    if (!historyData.length) {

        box.textContent =
            "هنوز دارایی مثبتی ثبت نشده است.";

        return;

    }

    box.innerHTML = "";

    historyData.forEach(item => {

        const div = document.createElement("div");

        div.className = "result";

        const title = document.createElement("strong");

        title.textContent =
            item.network + " — USDT";

        const details = document.createElement("div");

        details.textContent =
            "موجودی: " + item.balance +
            "\nآدرس: " + item.address +
            "\nزمان: " + item.date;

        details.style.whiteSpace = "pre-wrap";

        div.append(title, details);

        box.appendChild(div);

    });

}

/* درخواست RPC */

async function rpcCall(url, method, params) {

    const response = await fetch(url, {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            jsonrpc: "2.0",

            id: 1,

            method: method,

            params: params

        })

    });

    if (!response.ok) {

        throw new Error("RPC HTTP " + response.status);

    }

    const data = await response.json();

    if (data.error) {

        throw new Error(data.error.message);

    }

    if (data.result === undefined || data.result === null) {

        throw new Error("پاسخ RPC نامعتبر است");

    }

    return data.result;

}

/* بررسی USDT اتریوم و BNB */

async function checkEVM(network, address) {

    if (!/^0x[a-fA-F0-9]{40}$/.test(address)) {

        throw new Error("فرمت آدرس نامعتبر است");

    }

    const isETH = network === "Ethereum";

    const url = isETH ? RPC.ETH : RPC.BNB;

    const contract = isETH ?
        CONTRACTS.ETH :
        CONTRACTS.BNB;

    const decimals = isETH ? 6 : 18;

    const data =
        "0x70a08231" +
        address.slice(2).toLowerCase().padStart(64, "0");

    const result = await rpcCall(

        url,

        "eth_call",

        [
            {
                to: contract,
                data: data
            },
            "latest"
        ]

    );

    const balance =
        Number(BigInt(result)) / Math.pow(10, decimals);

    savePositive(network, address, balance);

    return balance;

}

/* بررسی USDT ترون */

async function checkTRON(address) {

    if (!/^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(address)) {

        throw new Error("فرمت آدرس ترون نامعتبر است");

    }

    const apiKey =
        document.getElementById("tronKey").value.trim();

    const headers = {};

    if (apiKey) {

        headers["TRON-PRO-API-KEY"] = apiKey;

    }

    const url =
        "https://api.trongrid.io/v1/accounts/" +
        encodeURIComponent(address) +
        "/tokens?limit=200&contract_address=" +
        encodeURIComponent(CONTRACTS.TRON);

    const response = await fetch(url, {
        headers: headers
    });

    if (!response.ok) {

        throw new Error(
            "TronGrid HTTP " + response.status +
            " — API Key یا محدودیت API را بررسی کنید"
        );

    }

    const data = await response.json();

    if (!Array.isArray(data.data)) {

        throw new Error("پاسخ TronGrid نامعتبر است");

    }

    let balance = 0;

    for (const token of data.data) {

        const tokenAddress =
            token.token_id ||
            token.address ||
            token.contract_address ||
            "";

        if (
            tokenAddress.toLowerCase() ===
            CONTRACTS.TRON.toLowerCase()
        ) {

            const decimals =
                Number(token.token_decimals ?? 6);

            balance =
                Number(BigInt(token.balance || "0")) /
                Math.pow(10, decimals);

            break;

        }

    }

    savePositive("TRON", address, balance);

    return balance;

}

/* اجرای بررسی */

async function runCheck(network, address, callback) {

    try {

        setStatus(
            "در حال بررسی " + network + " ..."
        );

        const balance = await callback(address);

        if (balance > 0) {

            return network +
                ": موجودی مثبت USDT = " +
                balance;

        }

        return network +
            ": بررسی موفق؛ موجودی مثبت پیدا نشد.";

    } catch(error) {

        return network +
            ": خطا — " + error.message;

    }

}

/* شروع */

async function startScan() {

    const button =
        document.getElementById("scanBtn");

    const tron =
        document.getElementById("tron").value.trim();

    const bnb =
        document.getElementById("bnb").value.trim();

    const eth =
        document.getElementById("eth").value.trim();

    if (!tron && !bnb && !eth) {

        setStatus(
            "حداقل یک آدرس عمومی وارد کنید."
        );

        return;

    }

    button.disabled = true;

    setStatus("بررسی آغاز شد...");

    try {

        const jobs = [];

        if (tron) {

            jobs.push(
                runCheck(
                    "TRON",
                    tron,
                    checkTRON
                )
            );

        }

        if (bnb) {

            jobs.push(
                runCheck(
                    "BNB Smart Chain",
                    bnb,
                    address => checkEVM("BNB", address)
                )
            );

        }

        if (eth) {

            jobs.push(
                runCheck(
                    "Ethereum",
                    eth,
                    address => checkEVM("Ethereum", address)
                )
            );

        }

        const results = await Promise.all(jobs);

        setStatus(
            "بررسی پایان یافت:\n\n" +
            results.join("\n\n") +
            "\n\nفقط موجودی‌های مثبت در تاریخچه ذخیره می‌شوند."
        );

    } finally {

        button.disabled = false;

    }

}

/* دانلود CSV */

function downloadCSV() {

    if (!historyData.length) {

        setStatus("تاریخچه خالی است.");

        return;

    }

    const rows = [

        ["Network", "Asset", "Balance", "Address", "Date"],

        ...historyData.map(item => [

            item.network,

            item.asset,

            item.balance,

            item.address,

            item.date

        ])

    ];

    const quote = value =>
        '"' + String(value).replace(/"/g, '""') + '"';

    const csv =
        "\uFEFF" +
        rows.map(row =>
            row.map(quote).join(",")
        ).join("\r\n");

    const blob = new Blob(
        [csv],
        {type: "text/csv;charset=utf-8"}
    );

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");

    a.href = url;

    a.download = "USDT-wallet-report.csv";

    a.click();

    URL.revokeObjectURL(url);

}

/* پاک کردن تاریخچه */

function clearHistory() {

    if (!confirm("تاریخچه پاک شود؟")) {

        return;

    }

    historyData = [];

    localStorage.removeItem(STORAGE);

    renderHistory();

    setStatus("تاریخچه پاک شد.");

}

/* اتصال دکمه‌ها */

document.getElementById("scanBtn")
.addEventListener("click", startScan);

document.getElementById("csvBtn")
.addEventListener("click", downloadCSV);

document.getElementById("clearBtn")
.addEventListener("click", clearHistory);

renderHistory();

</script>

</body>
</html>
