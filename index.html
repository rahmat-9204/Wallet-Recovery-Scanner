<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallet Balance Scanner</title>
<style>
body {
    font-family: Arial;
    background: #f1f4f9;
    color: #172033;
    padding: 15px;
}
main {
    max-width: 750px;
    margin: auto;
    background: white;
    padding: 18px;
    border-radius: 14px;
}
h2 {color:#1556b8}
input,select,button {
    width:100%;
    box-sizing:border-box;
    padding:12px;
    margin:7px 0;
    border-radius:8px;
    font-size:15px;
}
input,select {border:1px solid #ccd3df}
button {
    border:0;
    background:#1556b8;
    color:white;
    font-weight:bold;
}
.clear {background:#555}
.status {
    background:#edf2fa;
    padding:12px;
    border-radius:8px;
    white-space:pre-wrap;
}
.result {
    background:#f8f9fc;
    border:1px solid #16834a;
    padding:12px;
    border-radius:8px;
    margin-top:10px;
    direction:ltr;
    text-align:left;
    overflow-wrap:anywhere;
}
</style>
</head>
<body>
<main>
<h2>Wallet Balance Scanner</h2>
<h3>اطلاعات بازیابی</h3>

کلمه گمشده
جایگاه کلمه
<option value="">انتخاب جایگاه</option>
</select>
<h3>آدرس‌های عمومی کیف پول</h3>

Bitcoin
Ethereum
BNB
TRON
بررسی موجودی
پاک کردن تاریخچه
دانلود گزارش CSV

<h3>وضعیت</h3>
<div id="status" class="status">آماده بررسی</div>
<h3>تاریخچه دارایی‌های مثبت</h3>
<div id="results"></div>
</main>
<script>
const $ = id => document.getElementById(id);
for(let i=1;i<=12;i++){
    const option=document.createElement("option");
    option.value=i;
    option.textContent="جایگاه "+i;
    $("position").appendChild(option);
}
let history=[];
try{
    history=JSON.parse(
        localStorage.getItem("wallet_history")||"[]"
    );
}catch{
    history=[];
}
function save(){
    localStorage.setItem(
        "wallet_history",
        JSON.stringify(history)
    );
}
function render(){
    $("results").innerHTML="";
    history.slice().reverse().forEach(item=>{
        const box=document.createElement("div");
        box.className="result";
        const title=document.createElement("h3");
        title.textContent="دارایی مثبت پیدا شد";
        box.appendChild(title);
        const info=[
            "کلمه: "+item.word,
            "جایگاه: "+item.position,
            "شبکه: "+item.network,
            "آدرس: "+item.address,
            "موجودی: "+item.balance,
            "تاریخ: "+item.date
        ];
        info.forEach(value=>{
            const p=document.createElement("p");
            p.textContent=value;
            box.appendChild(p);
        });
        $("results").appendChild(box);
    });
}
async function getJSON(url){
    const controller=new AbortController();
    const timer=setTimeout(
        ()=>controller.abort(),15000
    );
    try{
        const response=await fetch(url,{
            signal:controller.signal
        });
        if(!response.ok){
            throw new Error("HTTP "+response.status);
        }
        return await response.json();
    }finally{
        clearTimeout(timer);
    }
}
async function checkBTC(address){
    const data=await getJSON(
        "https://blockstream.info/api/address/"+
        encodeURIComponent(address)
    );
    const balance=
        data.chain_stats.funded_txo_sum-
        data.chain_stats.spent_txo_sum+
        data.mempool_stats.funded_txo_sum-
        data.mempool_stats.spent_txo_sum;
    return {
        amount:balance/100000000,
        unit:"BTC"
    };
}
async function checkEVM(address,network){
    const rpc={
        ETH:"https://ethereum-rpc.publicnode.com",
        BNB:"https://bsc-rpc.publicnode.com"
    }[network];
    const response=await fetch(rpc,{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            jsonrpc:"2.0",
            method:"eth_getBalance",
            params:[address,"latest"],
            id:1
        })
    });
    if(!response.ok){
        throw new Error("RPC error");
    }
    const data=await response.json();
    if(data.error || !data.result){
        throw new Error("RPC response error");
    }
    const amount=BigInt(data.result);
    return {
        amount:Number(amount)/1e18,
        unit:network
    };
}
async function checkTRON(address){
    const data=await getJSON(
        "https://api.trongrid.io/v1/accounts/"+
        encodeURIComponent(address)
    );
    const account=data.data?.[0];
    return {
        amount:account?
            Number(account.balance||0)/1000000:0,
        unit:"TRX"
    };
}
function addResult(network,address,balance){
    if(balance.amount<=0)return;
    const item={
        word:$("word").value.trim(),
        position:$("position").value,
        network,
        address,
        balance:balance.amount+" "+balance.unit,
        date:new Date().toLocaleString()
    };
    const exists=history.some(x=>
        x.network===item.network &&
        x.address===item.address &&
        x.balance===item.balance &&
        x.word===item.word &&
        x.position===item.position
    );
    if(!exists){
        history.push(item);
        save();
        render();
    }
}
async function run(){
    const word=$("word").value.trim();
    const position=$("position").value;
    if(!word || !position){
        $("status").textContent=
            "کلمه و جایگاه آن را وارد کن.";
        return;
    }
    const addresses={
        BTC:$("btc").value.trim(),
        ETH:$("eth").value.trim(),
        BNB:$("bnb").value.trim(),
        TRON:$("tron").value.trim()
    };
    if(!Object.values(addresses).some(Boolean)){
        $("status").textContent=
            "حداقل یک آدرس عمومی وارد کن.";
        return;
    }
    const tasks=[
        ["BTC",addresses.BTC,checkBTC],
        ["ETH",addresses.ETH,(a)=>checkEVM(a,"ETH")],
        ["BNB",addresses.BNB,(a)=>checkEVM(a,"BNB")],
        ["TRON",addresses.TRON,checkTRON]
    ];
    let checked=0;
    let found=0;
    $("status").textContent="بررسی شروع شد...";
    for(const [network,address,fn] of tasks){
        if(!address)continue;
        try{
            const balance=await fn(address);
            checked++;
            if(balance.amount>0){
                addResult(network,address,balance);
                found++;
            }
        }catch(error){
            console.error(network,error);
        }
        $("status").textContent=
            "شبکه بررسی‌شده: "+checked+
            "\nدارایی مثبت: "+found;
    }
    $("status").textContent+=
        "\nبررسی پایان یافت.";
}
$("start").onclick=run;
$("clear").onclick=()=>{
    if(confirm("تمام تاریخچه پاک شود؟")){
        history=[];
        save();
        render();
        $("status").textContent="تاریخچه پاک شد.";
    }
};
$("csv").onclick=()=>{
    const rows=[
        ["Word","Position","Network","Address","Balance","Date"]
    ];
    history.forEach(x=>{
        rows.push([
            x.word,x.position,x.network,
            x.address,x.balance,x.date
        ]);
    });
    const csv=rows.map(row=>
        row.map(v=>
            '"'+String(v).replaceAll('"','""')+'"'
        ).join(",")
    ).join("\n");
    const blob=new Blob(
        ["\ufeff"+csv],
        {type:"text/csv;charset=utf-8"}
    );
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download="wallet-history.csv";
    a.click();
    URL.revokeObjectURL(url);
};
render();
</script>
</body>
</html>
