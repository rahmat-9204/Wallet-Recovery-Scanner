<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallet Balance Checker</title>

<style>
*{box-sizing:border-box}
body{
    font-family:Arial,sans-serif;
    background:#f1f4f9;
    color:#172033;
    padding:15px;
    margin:0
}
main{
    max-width:850px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 3px 15px #0001
}
h2{text-align:center;color:#173c70}
textarea,input,select,button{
    width:100%;
    padding:12px;
    margin:7px 0;
    border:1px solid #ccd5e2;
    border-radius:8px;
    font-size:14px
}
textarea{height:120px;direction:ltr}
button{
    background:#1769aa;
    color:white;
    border:0;
    cursor:pointer;
    font-weight:bold
}
button:disabled{background:#999}
.stop{background:#bd3545}
.secondary{background:#536579}
.status{
    padding:12px;
    background:#eef5ff;
    border-radius:8px;
    margin-top:12px;
    line-height:1.8
}
.card{
    border:1px solid #dce3ed;
    padding:12px;
    border-radius:9px;
    margin:10px 0;
    overflow-wrap:anywhere
}
.good{border-right:4px solid #16a36a}
.bad{border-right:4px solid #d94a4a}
.muted{color:#68758a;font-size:12px}
table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px
}
td,th{
    padding:9px;
    border-bottom:1px solid #e2e7ef;
    text-align:right;
    font-size:13px
}
</style>
</head>

<body>
<main>

<h2>بررسی موجودی کیف پول</h2>

<p class="muted">
فقط آدرس عمومی کیف پول را وارد کنید.
این برنامه هیچ عبارت بازیابی یا کلید خصوصی دریافت نمی‌کند.
</p>

<label>آدرس‌های عمومی (هر آدرس در یک خط):</label>
<textarea id="addresses" placeholder="آدرس BTC یا ETH یا TRON را وارد کنید"></textarea>

<label>تعداد درخواست هم‌زمان:</label>
<select id="workers">
<option value="1">۱</option>
<option value="2">۲</option>
<option value="3">۳</option>
</select>

<button id="startBtn" onclick="startScan()">شروع بررسی</button>
<button class="stop" onclick="stopScan()">توقف</button>
<button class="secondary" onclick="downloadCSV()">دانلود CSV</button>
<button class="secondary" onclick="clearResults()">پاک‌کردن نتایج</button>

<div class="status" id="status">آماده بررسی</div>

<div id="results"></div>

</main>

<script>
const RPC = {
 ethereum:"https://ethereum-rpc.publicnode.com",
 bsc:"https://bsc-rpc.publicnode.com",
 polygon:"https://polygon-bor-rpc.publicnode.com",
 arbitrum:"https://arbitrum-one-rpc.publicnode.com",
 base:"https://base-rpc.publicnode.com",
 optimism:"https://optimism-rpc.publicnode.com",
 avalanche:"https://avalanche-c-chain-rpc.publicnode.com"
};

const CHAINS = [
 {
  name:"Ethereum",
  key:"ethereum",
  symbol:"ETH",
  decimals:18,
  tokens:[
   ["USDT","0xdAC17F958D2ee523a2206206994597C13D831ec7",6],
   ["USDC","0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48",6]
  ]
 },
 {
  name:"BNB Smart Chain",
  key:"bsc",
  symbol:"BNB",
  decimals:18,
  tokens:[
   ["USDT","0x55d398326f99059fF775485246999027B3197955",18],
   ["USDC","0x8AC76a51cc950d9822D68b83fE1Ad97B32Cd580d",18]
  ]
 },
 {
  name:"Polygon",
  key:"polygon",
  symbol:"POL",
  decimals:18,
  tokens:[
   ["USDT","0xc2132D05D31c914a87C6611C10748AaCbAbeD5F",6],
   ["USDC","0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359",6]
  ]
 },
 {
  name:"Arbitrum",
  key:"arbitrum",
  symbol:"ETH",
  decimals:18,
  tokens:[
   ["USDT","0xFd086bC7CD5C481DCC9C85ebE478A1C0b69FCbb9",6],
   ["USDC","0xaf88d065e77c8cC2239327C5EDb3A432268e5831",6]
  ]
 },
 {
  name:"Base",
  key:"base",
  symbol:"ETH",
  decimals:18,
  tokens:[
   ["USDC","0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913",6]
  ]
 },
 {
  name:"Optimism",
  key:"optimism",
  symbol:"ETH",
  decimals:18,
  tokens:[
   ["USDT","0x94b008aA00579c1307B0EF2c499aD98a8ce58e58",6],
   ["USDC","0x0b2C639c533813f4Aa9D7837CAf62653d097Ff85",6]
  ]
 },
 {
  name:"Avalanche",
  key:"avalanche",
  symbol:"AVAX",
  decimals:18,
  tokens:[
   ["USDT","0x9702230A8Ea53601f5cD2dc00fDBc13d4dF4A8c7",6],
   ["USDC","0xB97EF9Ef8734C71904D8002F8b6Bc66Dd9c48a6E",6]
  ]
 }
];

let running=false;
let results=[];
let completed=0;
let total=0;

function setStatus(text){
 document.getElementById("status").innerText=text;
}

function sleep(ms){
 return new Promise(resolve=>setTimeout(resolve,ms));
}

function validEVM(a){
 return /^0x[a-fA-F0-9]{40}$/.test(a);
}

function validBTC(a){
 return /^(1|3)[a-km-zA-HJ-NP-Z1-9]{25,34}$/.test(a)
 || /^bc1[a-zA-HJ-NP-Z0-9]{20,90}$/i.test(a);
}

function validTRON(a){
 return /^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(a);
}

async function requestJSON(url,options={}){
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),15000);

 try{
  const response=await fetch(url,{
   ...options,
   signal:controller.signal
  });

  if(!response.ok){
   throw new Error("HTTP "+response.status);
  }

  return await response.json();

 }finally{
  clearTimeout(timer);
 }
}

async function rpc(chain,method,params){
 const data=await requestJSON(RPC[chain],{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
   jsonrpc:"2.0",
   id:1,
   method,
   params
  })
 });

 if(data.error) throw new Error(data.error.message);
 return data.result;
}

function formatUnits(value,decimals){
 let n=BigInt(value);
 let base=10n**BigInt(decimals);
 let whole=n/base;
 let fraction=(n%base).toString().padStart(decimals,"0");
 fraction=fraction.replace(/0+$/,"");
 return fraction ? whole+"."+fraction : whole.toString();
}

async function checkEVM(address,chain){
 let found=[];

 try{
  const balance=await rpc(
   chain.key,
   "eth_getBalance",
   [address,"latest"]
  );

  const native=BigInt(balance);

  if(native>0n){
   found.push({
    network:chain.name,
    token:chain.symbol,
    balance:formatUnits(native,chain.decimals)
   });
  }

 }catch(e){
  throw new Error(chain.name+" native: "+e.message);
 }

 for(const token of chain.tokens){

  if(!running) break;

  try{
   const contract=token[1];
   const decimals=token[2];

   const data="0x70a08231"+
    address.slice(2).toLowerCase().padStart(64,"0");

   const result=await rpc(
    chain.key,
    "eth_call",
    [{to:contract,data},"latest"]
   );

   const amount=BigInt(result||"0x0");

   if(amount>0n){
    found.push({
     network:chain.name,
     token:token[0],
     balance:formatUnits(amount,decimals)
    });
   }

  }catch(e){
   console.warn(chain.name,token[0],e.message);
  }

  await sleep(200);
 }

 return found;
}

async function checkBTC(address){
 const data=await requestJSON(
  "https://blockstream.info/api/address/"+encodeURIComponent(address)
 );

 const funded=data.chain_stats.funded_txo_sum+
              data.mempool_stats.funded_txo_sum;

 const spent=data.chain_stats.spent_txo_sum+
             data.mempool_stats.spent_txo_sum;

 const sats=funded-spent;

 if(sats>0){
  return [{
   network:"Bitcoin",
   token:"BTC",
   balance:(sats/100000000).toFixed(8)
  }];
 }

 return [];
}

async function checkTRON(address){
 const data=await requestJSON(
  "https://api.trongrid.io/wallet/getaccount",
  {
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    address:address,
    visible:true
   })
  }
 );

 let found=[];

 if(data.balance && Number(data.balance)>0){
  found.push({
   network:"TRON",
   token:"TRX",
   balance:(Number(data.balance)/1000000).toString()
  });
 }

 const tokens=data.trc20||[];

 for(const item of tokens){
  for(const contract in item){
   const raw=item[contract];

   if(raw && BigInt(raw)>0n){
    found.push({
     network:"TRON",
     token:contract,
     balance:"مقدار خام: "+raw
    });
   }
  }
 }

 return found;
}

async function checkAddress(address){
 let found=[];
 let errors=[];

 if(validEVM(address)){

  for(const chain of CHAINS){
   if(!running) break;

   try{
    const data=await checkEVM(address,chain);
    found.push(...data);
   }catch(e){
    errors.push(e.message);
   }

   await sleep(300);
  }

 }else if(validBTC(address)){

  try{
   found.push(...await checkBTC(address));
  }catch(e){
   errors.push("Bitcoin: "+e.message);
  }

 }else if(validTRON(address)){

  try{
   found.push(...await checkTRON(address));
  }catch(e){
   errors.push("TRON: "+e.message);
  }

 }else{
  errors.push("فرمت آدرس شناخته نشد");
 }

 return {found,errors};
}

function escapeHTML(text){
 return String(text).replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c]));
}

function showResult(address,data){
 const box=document.createElement("div");

 box.className="card "+(
  data.found.length?"good":"bad"
 );

 let html="<b>آدرس:</b><br>"+
 escapeHTML(address)+"<br><br>";

 if(data.found.length){

  html+="<b>موجودی‌های مثبت:</b>";

  html+="<table><tr><th>شبکه</th><th>ارز</th><th>موجودی</th></tr>";

  for(const item of data.found){
   html+="<tr><td>"+escapeHTML(item.network)+
   "</td><td>"+escapeHTML(item.token)+
   "</td><td>"+escapeHTML(item.balance)+"</td></tr>";
  }

  html+="</table>";

 }else{
  html+="هیچ موجودی مثبتی در موارد بررسی‌شده پیدا نشد.";
 }

 if(data.errors.length){
  html+="<p class='muted'>خطاها:<br>"+
  data.errors.map(escapeHTML).join("<br>")+
  "</p>";
 }

 box.innerHTML=html;

 document.getElementById("results").prepend(box);
}

async function startScan(){
 if(running)return;

 const addresses=document.getElementById("addresses")
 .value.split(/\r?\n/)
 .map(x=>x.trim())
 .filter(Boolean);

 if(!addresses.length){
  alert("لطفاً آدرس عمومی وارد کنید");
  return;
 }

 running=true;
 completed=0;
 total=addresses.length;

 document.getElementById("startBtn").disabled=true;

 const workers=Number(
  document.getElementById("workers").value
 );

 let index=0;

 async function worker(){
  while(running){

   const current=index++;

   if(current>=addresses.length)break;

   const address=addresses[current];

   setStatus(
    "در حال بررسی "+(current+1)+
    " از "+total
   );

   const data=await checkAddress(address);

   if(data.found.length){
    results.push({
     address,
     assets:data.found
    });
   }

   showResult(address,data);

   completed++;

   setStatus(
    "بررسی شده: "+completed+
    " از "+total
   );
  }
 }

 await Promise.all(
  Array.from({length:workers},()=>worker())
 );

 running=false;

 document.getElementById("startBtn").disabled=false;

 setStatus(
  "بررسی پایان یافت. تعداد بررسی‌شده: "+completed
 );

 localStorage.setItem(
  "wallet_checker_results",
  JSON.stringify(results)
 );
}

function stopScan(){
 running=false;
 setStatus("درخواست توقف ثبت شد");
}

function clearResults(){
 results=[];
 document.getElementById("results").innerHTML="";
 localStorage.removeItem("wallet_checker_results");
 setStatus("نتایج پاک شد");
}

function downloadCSV(){
 if(!results.length){
  alert("نتیجه‌ای برای دانلود وجود ندارد");
  return;
 }

 let csv="Address,Network,Token,Balance\n";

 for(const item of results){
  for(const asset of item.assets){
   csv+=`"${item.address}","${asset.network}","${asset.token}","${asset.balance}"\n`;
  }
 }

 const blob=new Blob(
  ["\uFEFF"+csv],
  {type:"text/csv;charset=utf-8"}
 );

 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");

 a.href=url;
 a.download="wallet-balances.csv";
 a.click();

 URL.revokeObjectURL(url);
}

(function loadSaved(){
 try{
  const saved=JSON.parse(
   localStorage.getItem("wallet_checker_results")||"[]"
  );

  results=saved;

 }catch(e){
  results=[];
 }
})();
</script>
</body>
</html>
