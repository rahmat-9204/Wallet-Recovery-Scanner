<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USDT Wallet Scanner</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f1f4f9;
    color: #172033;
    padding: 15px;
}
main {
    max-width: 750px;
    margin: auto;
    background: white;
    padding: 18px;
    border-radius: 14px;
}
h2 { color: #1556b8; }
textarea,input,button {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    margin: 7px 0;
    border-radius: 8px;
    font-size: 15px;
}
textarea,input { border: 1px solid #ccd3df; }
button {
    border: 0;
    background: #1556b8;
    color: white;
    font-weight: bold;
}
.stop { background: #a52a2a; }
.clear { background: #555; }
.report { background: #16834a; }
.warning {
    background: #fff1d0;
    color: #674800;
    padding: 12px;
    border-radius: 8px;
    line-height: 1.8;
}
.status {
    background: #edf2fa;
    padding: 12px;
    border-radius: 8px;
    white-space: pre-wrap;
    line-height: 1.8;
}
.result {
    background: #f8f9fc;
    border: 1px solid #d5dce8;
    padding: 12px;
    border-radius: 8px;
    margin-top: 10px;
    direction: ltr;
    text-align: left;
    overflow-wrap: anywhere;
}
</style>
</head>
<body>
<main>
<h2>USDT Wallet Balance Scanner</h2>
<p>بررسی موجودی تتر در سه شبکه اصلی.</p>
<div class="warning">
این برنامه فقط آدرس عمومی کیف پول را بررسی می‌کند.
هیچ عبارت بازیابی یا کلید خصوصی وارد نکن.
</div>
<h3>۱. آدرس‌های کیف پول</h3>
<textarea id="addresses" rows="5"
placeholder="هر آدرس را در یک خط وارد کن"></textarea>
<button id="start">شروع بررسی</button>
<button id="stop" class="stop">توقف بررسی</button>
<button id="clear" class="clear">پاک کردن نتایج</button>
<button id="csv" class="report">دانلود گزارش CSV</button>
<h3>وضعیت</h3>
<div id="status" class="status">آماده شروع</div>
<h3>دارایی‌های پیدا شده</h3>
<div id="results"></div>
</main>
<script>
const $ = id => document.getElementById(id);
let stopped = false;
let results = JSON.parse(
    localStorage.getItem("usdt_results") || "[]"
);
const CONTRACTS = {
    ERC20: {
        address: "0xdAC17F958D2ee523a2206206994597C13D831ec7",
        rpc: "https://ethereum-rpc.publicnode.com"
    },
    BEP20: {
        address: "0x55d398326f99059fF775485246999027B3197955",
        rpc: "https://bsc-rpc.publicnode.com"
    }
};
const TRON_CONTRACT =
"TXLAQ63Xg1NAzckPwKHvzw7CSEmLMEqcdj";
function status(text) {
    $("status").textContent = text;
}
function save() {
    localStorage.setItem(
        "usdt_results",
        JSON.stringify(results)
    );
}
function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}
function validEVM(address) {
    return /^0x[a-fA-F0-9]{40}$/.test(address);
}
function validTRON(address) {
    return /^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(address);
}
async function rpc(url, method, params) {
    const response = await fetch(url, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            jsonrpc: "2.0",
            id: 1,
            method,
            params
        })
    });
    if (!response.ok) {
        throw Error("RPC HTTP " + response.status);
    }
    const data = await response.json();
    if (data.error) {
        throw Error(data.error.message);
    }
    return data.result;
}
/* ERC20 / BEP20 */
async function checkEVM(address, network) {
    const config = CONTRACTS[network];
    const cleanAddress = address.slice(2).toLowerCase();
    const data = await rpc(
        config.rpc,
        "eth_call",
        [{
            to: config.address,
            data: "0x70a08231" +
                  cleanAddress.padStart(64, "0")
        }, "latest"]
    );
    const raw = BigInt(data);
    return Number(raw) / 1e18;
}
/* TRC20 */
async function checkTRON(address) {
    const response = await fetch(
        "https://api.trongrid.io/v1/accounts/" +
        encodeURIComponent(address)
    );
    if (!response.ok) {
        throw Error("TRON HTTP " + response.status);
    }
    const data = await response.json();
    if (!data.data || !data.data.length) {
        return 0;
    }
    const account = data.data[0];
    const tokens = account.trc20 || {};
    let balance = 0;
    for (const token of tokens) {
        if (
            Object.prototype.hasOwnProperty.call(
                token,
                TRON_CONTRACT
            )
        ) {
            balance =
                Number(token[TRON_CONTRACT]) / 1e6;
            break;
        }
    }
    return balance;
}
/* Display */
function render() {
    $("results").innerHTML = "";
    for (const item of [...results].reverse()) {
        const box = document.createElement("div");
        box.className = "result";
        const title = document.createElement("h3");
        title.textContent = "USDT پیدا شد";
        const network = document.createElement("p");
        network.textContent = "شبکه: " + item.network;
        const address = document.createElement("p");
        address.textContent = "آدرس: " + item.address;
        const balance = document.createElement("h3");
        balance.textContent =
            "موجودی USDT: " + item.balance;
        box.append(title, network, address, balance);
        $("results").appendChild(box);
    }
}
/* Scanner */
async function scan() {
    stopped = false;
    const addresses = $("addresses")
        .value
        .trim()
        .split(/\s+/)
        .filter(Boolean);
    if (!addresses.length) {
        status("لطفاً آدرس کیف پول وارد کن.");
        return;
    }
    let checked = 0;
    status("بررسی شروع شد...");
    for (const address of addresses) {
        if (stopped) break;
        const isTRON = validTRON(address);
        const isEVM = validEVM(address);
        if (!isTRON && !isEVM) {
            status(
                "آدرس نامعتبر:\n" + address
            );
            continue;
        }
        const networks = isTRON
            ? ["TRC20"]
            : ["ERC20", "BEP20"];
        for (const network of networks) {
            if (stopped) break;
            checked++;
            status(
                "آدرس: " + address +
                "\nشبکه: " + network +
                "\nتعداد بررسی: " + checked
            );
            try {
                let balance = 0;
                if (network === "TRC20") {
                    balance = await checkTRON(address);
                } else {
                    balance = await checkEVM(address, network);
                }
                if (balance > 0) {
                    const item = {
                        address,
                        network,
                        balance,
                        date: new Date().toISOString()
                    };
                    results.push(item);
                    save();
                    render();
                }
            } catch(error) {
                status(
                    "خطا در بررسی " + network +
                    "\n" + error.message
                );
            }
            await sleep(500);
        }
    }
    if (stopped) {
        status("بررسی متوقف شد.");
    } else {
        status(
            "بررسی پایان یافت.\n" +
            "تعداد بررسی‌ها: " + checked
        );
    }
}
/* Buttons */
$("start").onclick = scan;
$("stop").onclick = () => {
    stopped = true;
    status("درخواست توقف ثبت شد.");
};
$("clear").onclick = () => {
    if (confirm("تمام نتایج پاک شود؟")) {
        results = [];
        save();
        render();
        status("نتایج پاک شد.");
    }
};
/* CSV */
$("csv").onclick = () => {
    const rows = [
        ["Address", "Network", "USDT Balance", "Date"]
    ];
    for (const item of results) {
        rows.push([
            item.address,
            item.network,
            item.balance,
            item.date
        ]);
    }
    const csv = rows.map(row =>
        row.map(value =>
            '"' + String(value).replaceAll('"', '""') + '"'
        ).join(",")
    ).join("\n");
    const blob = new Blob(
        ["\ufeff" + csv],
        {type: "text/csv;charset=utf-8"}
    );
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "usdt-results.csv";
    link.click();
    URL.revokeObjectURL(url);
};
render();
</script>
</main>
</body>
</html>
