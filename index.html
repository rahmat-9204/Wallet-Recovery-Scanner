<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallet Balance Scanner</title>
<style>
body {
    font-family: Arial,sans-serif;
    background: #f1f4f9;
    color: #172033;
    padding: 15px;
}
main {
    max-width: 750px;
    margin: auto;
    background: white;
    padding: 18px;
    border-radius: 14px;
}
h2 {color:#1556b8}
textarea,input,button {
    width:100%;
    box-sizing:border-box;
    padding:12px;
    margin:7px 0;
    border-radius:8px;
    font-size:15px;
}
textarea,input {border:1px solid #ccd3df}
button {
    border:0;
    background:#1556b8;
    color:white;
    font-weight:bold;
}
.report {background:#16834a}
.warning {
    background:#fff1d0;
    color:#674800;
    padding:12px;
    border-radius:8px;
    line-height:1.8;
}
.status {
    background:#edf2fa;
    padding:12px;
    border-radius:8px;
    white-space:pre-wrap;
    line-height:1.8;
}
.result {
    background:#f8f9fc;
    border:1px solid #d5dce8;
    padding:12px;
    border-radius:8px;
    margin-top:10px;
    direction:ltr;
    text-align:left;
    overflow-wrap:anywhere;
}
.small {
    font-size:13px;
    color:#667085;
    line-height:1.7;
}
</style>
</head>
<body>
<main>
<h2>Wallet Balance Scanner</h2>
<p>بررسی موجودی ارزهای اصلی و تتر در سه شبکه.</p>
<div class="warning">
<strong>هشدار امنیتی:</strong>
فقط آدرس عمومی کیف‌پول را وارد کن.
هرگز عبارت بازیابی یا کلید خصوصی خود را وارد نکن.
</div>
<h3>آدرس اتریوم و BNB</h3>
<textarea id="evm" rows="2"
placeholder="0x..."></textarea>
<h3>آدرس ترون</h3>
<textarea id="tron" rows="2"
placeholder="T..."></textarea>
<button id="start">شروع بررسی موجودی</button>
<button id="csv" class="report">دانلود گزارش CSV</button>
<h3>وضعیت</h3>
<div id="status" class="status">آماده بررسی</div>
<h3>دارایی‌های پیدا شده</h3>
<div id="results"></div>
</main>
<script type="module">
const $ = id => document.getElementById(id);
let results = [];
const CONTRACTS = {
    ETH: "0xdAC17F958D2ee523a2206206994597C13D831ec7",
    BNB: "0x55d398326f99059fF775485246999027B3197955",
    TRON: "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t"
};
function status(text) {
    $("status").textContent = text;
}
async function fetchJSON(url,options={}) {
    const controller = new AbortController();
    const timeout = setTimeout(
        ()=>controller.abort(),
        20000
    );
    try {
        const response = await fetch(url,{
            ...options,
            signal:controller.signal
        });
        if (!response.ok) {
            throw Error("HTTP "+response.status);
        }
        return await response.json();
    } finally {
        clearTimeout(timeout);
    }
}
async function rpc(url,method,params) {
    const data = await fetchJSON(url,{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            jsonrpc:"2.0",
            id:1,
            method,
            params
        })
    });
    if(data.error) {
        throw Error(data.error.message);
    }
    return data.result;
}
function hexToDecimal(hex) {
    return BigInt(hex).toString();
}
function formatUnits(value,decimals) {
    const number = BigInt(value);
    const base = 10n ** BigInt(decimals);
    const whole = number / base;
    const fraction = (number % base)
        .toString()
        .padStart(decimals,"0")
        .replace(/0+$/,"");
    return fraction
        ? whole.toString()+"."+fraction
        : whole.toString();
}
async function checkEVM(url,address,contract) {
    const native = await rpc(
        url,
        "eth_getBalance",
        [address,"latest"]
    );
    const data = await rpc(
        url,
        "eth_call",
        [{
            to:contract,
            data:"0x70a08231"+
            address.slice(2).toLowerCase().padStart(64,"0")
        },"latest"]
    );
    return {
        native:formatUnits(
            hexToDecimal(native),18
        ),
        usdt:formatUnits(
            hexToDecimal(data),6
        )
    };
}
async function checkTRON(address) {
    const account = await fetchJSON(
        "https://api.trongrid.io/v1/accounts/"+
        encodeURIComponent(address)
    );
    const data = account.data?.[0];
    const trx = Number(data?.balance || 0);
    let usdt = "0";
    const token = data?.trc20 || [];
    for(const item of token) {
        if(
            item[CONTRACTS.TRON] !== undefined
        ) {
            usdt = formatUnits(
                item[CONTRACTS.TRON],6
            );
        }
    }
    return {
        native:trx/1000000,
        usdt:usdt
    };
}
function addResult(network,address,data) {
    const native = Number(data.native);
    const usdt = Number(data.usdt);
    if(native <= 0 && usdt <= 0) {
        return;
    }
    results.push({
        network,
        address,
        native:data.native,
        usdt:data.usdt
    });
    render();
}
function render() {
    $("results").innerHTML = "";
    for(const item of results) {
        const box = document.createElement("div");
        box.className="result";
        const title=document.createElement("h3");
        title.textContent=item.network;
        const address=document.createElement("p");
        address.textContent="Address: "+item.address;
        const native=document.createElement("p");
        native.textContent=
            "Native Balance: "+item.native;
        const usdt=document.createElement("p");
        usdt.textContent=
            "USDT Balance: "+item.usdt;
        box.append(
            title,address,native,usdt
        );
        $("results").appendChild(box);
    }
}
async function scan() {
    results=[];
    $("results").innerHTML="";
    const evm=$("evm").value.trim();
    const tron=$("tron").value.trim();
    if(
        evm &&
        !/^0x[a-fA-F0-9]{40}$/.test(evm)
    ) {
        status("آدرس اتریوم و BNB معتبر نیست.");
        return;
    }
    if(
        tron &&
        !/^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(tron)
    ) {
        status("آدرس ترون معتبر نیست.");
        return;
    }
    if(!evm && !tron) {
        status("حداقل یک آدرس وارد کن.");
        return;
    }
    $("start").disabled=true;
    try {
        if(evm) {
            status("در حال بررسی ETH و USDT اتریوم...");
            try {
                const data=await checkEVM(
                    "https://ethereum-rpc.publicnode.com",
                    evm,
                    CONTRACTS.ETH
                );
                addResult("Ethereum ERC20",evm,data);
            } catch(error) {
                status(
                    "خطای اتریوم: "+error.message
                );
            }
            status("در حال بررسی BNB و USDT بایننس...");
            try {
                const data=await checkEVM(
                    "https://bsc-rpc.publicnode.com",
                    evm,
                    CONTRACTS.BNB
                );
                addResult("BNB Smart Chain BEP20",evm,data);
            } catch(error) {
                status(
                    "خطای BNB: "+error.message
                );
            }
        }
        if(tron) {
            status("در حال بررسی TRX و USDT ترون...");
            try {
                const data=await checkTRON(tron);
                addResult("TRON TRC20",tron,data);
            } catch(error) {
                status(
                    "خطای TRON: "+error.message
                );
            }
        }
        status(
            results.length
            ? "بررسی پایان یافت. دارایی‌های مثبت نمایش داده شدند."
            : "بررسی پایان یافت. دارایی مثبتی پیدا نشد یا API پاسخ نداد."
        );
    } finally {
        $("start").disabled=false;
    }
}
$("start").onclick=scan;
$("csv").onclick=()=>{
    const rows=[
        ["Network","Address","Native Balance","USDT"]
    ];
    for(const item of results) {
        rows.push([
            item.network,
            item.address,
            item.native,
            item.usdt
        ]);
    }
    const csv=rows.map(row=>
        row.map(value=>
            '"'+String(value).replaceAll('"','""')+'"'
        ).join(",")
    ).join("\n");
    const blob=new Blob(
        ["\ufeff"+csv],
        {type:"text/csv;charset=utf-8"}
    );
    const url=URL.createObjectURL(blob);
    const link=document.createElement("a");
    link.href=url;
    link.download="wallet-balance-report.csv";
    link.click();
    URL.revokeObjectURL(url);
};
</script>
</body>
</html>
