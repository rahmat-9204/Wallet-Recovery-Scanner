<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallet Balance Scanner</title>

<style>
*{box-sizing:border-box}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:#f1f4f9;
    color:#172033;
    padding:15px;
    margin:0;
}

main{
    max-width:750px;
    margin:auto;
    background:white;
    padding:18px;
    border-radius:14px;
}

h2{color:#1556b8}

input,select,button{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    margin:7px 0;
    border-radius:8px;
    font-size:15px;
}

input,select{
    border:1px solid #ccd3df;
    background:white;
}

button{
    border:0;
    background:#1556b8;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.5;
    cursor:wait;
}

.clear{background:#555}
.csv{background:#16834a}

.status{
    background:#edf2fa;
    padding:12px;
    border-radius:8px;
    white-space:pre-wrap;
    line-height:1.9;
    overflow-wrap:anywhere;
}

.result{
    background:#f8f9fc;
    border:1px solid #16834a;
    padding:12px;
    border-radius:8px;
    margin-top:10px;
    direction:ltr;
    text-align:left;
    overflow-wrap:anywhere;
    line-height:1.8;
}

.result h3{color:#16834a}

label{
    display:block;
    margin-top:12px;
    font-weight:bold;
}

.small{
    font-size:12px;
    color:#667085;
    line-height:1.8;
}

</style>
</head>

<body>

<main>

<h2>Wallet Balance Scanner</h2>

<h3>اطلاعات بازیابی</h3>

<label>کلمه گمشده بازیابی‌شده (ثبت دستی)</label>
<input id="word" type="text" placeholder="کلمه را برای ثبت گزارش وارد کنید">

<label>جایگاه کلمه</label>
<select id="position">
<option value="">انتخاب جایگاه</option>
</select>

<h3>آدرس‌های عمومی کیف پول</h3>

<label>Bitcoin</label>
<input id="btc" dir="ltr" placeholder="آدرس عمومی Bitcoin">

<label>Ethereum</label>
<input id="eth" dir="ltr" placeholder="0x...">

<label>BNB Smart Chain</label>
<input id="bnb" dir="ltr" placeholder="0x...">

<label>TRON</label>
<input id="tron" dir="ltr" placeholder="T...">

<label>TronGrid API Key (اختیاری)</label>
<input id="tronKey" dir="ltr" placeholder="API Key">

<button id="start">شروع بررسی موجودی</button>

<button id="clear" class="clear">پاک کردن تاریخچه</button>

<button id="csv" class="csv">دانلود گزارش CSV</button>

<h3>وضعیت</h3>

<div id="status" class="status">
آماده بررسی
</div>

<h3>تاریخچه دارایی‌های مثبت</h3>

<div id="results"></div>

<p class="small">
این برنامه موجودی کوین اصلی و USDT را بررسی می‌کند.
توکن‌های دیگر و NFTها بررسی نمی‌شوند.
خطای اتصال به API به معنی موجودی صفر نیست.
</p>

</main>

<script>
"use strict";

/* =========================
   تنظیمات قراردادها
========================= */

const CONTRACTS = {

    ETH_USDT:
    "0xdAC17F958D2ee523a2206206994597C13D831ec7",

    BNB_USDT:
    "0x55d398326f99059fF775485246999027B3197955",

    TRON_USDT:
    "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t"

};

const RPC = {

    ETH:
    "https://ethereum-rpc.publicnode.com",

    BNB:
    "https://bsc-rpc.publicnode.com"

};

const STORAGE_KEY = "wallet_history";

/* =========================
   جایگاه کلمه
========================= */

for(let i=1;i<=12;i++){

    const option=document.createElement("option");

    option.value=i;

    option.textContent="جایگاه "+i;

    document.getElementById("position").appendChild(option);

}

/* =========================
   تاریخچه
========================= */

let history=[];

try{

    history=JSON.parse(
        localStorage.getItem(STORAGE_KEY)||"[]"
    );

    if(!Array.isArray(history)){
        history=[];
    }

}catch(e){

    history=[];

}

function saveHistory(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(history)
    );

}

function render(){

    const box=document.getElementById("results");

    box.innerHTML="";

    if(history.length===0){

        box.textContent=
            "هنوز دارایی مثبتی ثبت نشده است.";

        return;

    }

    history.slice().reverse().forEach(item=>{

        const div=document.createElement("div");

        div.className="result";

        const title=document.createElement("h3");

        title.textContent=
            "دارایی مثبت پیدا شد: "+item.asset;

        div.appendChild(title);

        const info=[

            "کلمه ثبت‌شده: "+item.word,

            "جایگاه: "+item.position,

            "شبکه: "+item.network,

            "آدرس: "+item.address,

            "موجودی: "+item.balance,

            "تاریخ: "+item.date

        ];

        info.forEach(value=>{

            const p=document.createElement("p");

            p.textContent=value;

            div.appendChild(p);

        });

        box.appendChild(div);

    });

}

/* =========================
   ذخیره فقط موجودی مثبت
========================= */

function addResult(network,asset,address,amount){

    if(!Number.isFinite(amount)||amount<=0){

        return;

    }

    const item={

        word:document.getElementById("word").value.trim(),

        position:document.getElementById("position").value,

        network:network,

        asset:asset,

        address:address,

        balance:amount+" "+asset,

        date:new Date().toLocaleString()

    };

    const exists=history.some(x=>

        x.network===item.network&&

        x.asset===item.asset&&

        x.address.toLowerCase()===item.address.toLowerCase()&&

        x.balance===item.balance

    );

    if(!exists){

        history.push(item);

        saveHistory();

        render();

    }

}

/* =========================
   درخواست JSON با Timeout
========================= */

async function getJSON(url,options={}){

    const controller=new AbortController();

    const timer=setTimeout(
        ()=>controller.abort(),
        20000
    );

    try{

        const response=await fetch(url,{

            ...options,

            signal:controller.signal

        });

        if(!response.ok){

            throw new Error("HTTP "+response.status);

        }

        return await response.json();

    }finally{

        clearTimeout(timer);

    }

}

/* =========================
   RPC
========================= */

async function rpcCall(url,method,params){

    const data=await getJSON(url,{

        method:"POST",

        headers:{

            "Content-Type":"application/json"

        },

        body:JSON.stringify({

            jsonrpc:"2.0",

            id:1,

            method:method,

            params:params

        })

    });

    if(data.error){

        throw new Error(
            data.error.message||"RPC Error"
        );

    }

    if(data.result===undefined||data.result===null){

        throw new Error("پاسخ RPC نامعتبر است");

    }

    return data.result;

}

/* =========================
   بررسی Bitcoin
========================= */

async function checkBTC(address){

    if(!/^(bc1[a-z0-9]{11,}|[13][a-km-zA-HJ-NP-Z1-9]{25,34})$/.test(address)){

        throw new Error("آدرس Bitcoin نامعتبر است");

    }

    const data=await getJSON(

        "https://blockstream.info/api/address/"+
        encodeURIComponent(address)

    );

    if(!data.chain_stats||!data.mempool_stats){

        throw new Error("پاسخ Bitcoin ناقص است");

    }

    const balance=

        data.chain_stats.funded_txo_sum+
        data.mempool_stats.funded_txo_sum-

        data.chain_stats.spent_txo_sum-
        data.mempool_stats.spent_txo_sum;

    addResult(
        "Bitcoin",
        "BTC",
        address,
        balance/1e8
    );

    return balance/1e8;

}

/* =========================
   بررسی Ethereum و BNB
========================= */

async function checkEVM(address,network){

    if(!/^0x[a-fA-F0-9]{40}$/.test(address)){

        throw new Error("آدرس EVM نامعتبر است");

    }

    const isETH=network==="Ethereum";

    const rpc= isETH ? RPC.ETH : RPC.BNB;

    const contract= isETH ?
        CONTRACTS.ETH_USDT :
        CONTRACTS.BNB_USDT;

    const decimals= isETH ? 6 : 18;

    /* موجودی کوین اصلی */

    const nativeHex=await rpcCall(

        rpc,

        "eth_getBalance",

        [address,"latest"]

    );

    const nativeBalance=
        Number(BigInt(nativeHex))/1e18;

    addResult(

        network,

        isETH?"ETH":"BNB",

        address,

        nativeBalance

    );

    /* موجودی USDT */

    const callData=

        "0x70a08231"+

        address.slice(2).toLowerCase().padStart(64,"0");

    const tokenHex=await rpcCall(

        rpc,

        "eth_call",

        [

            {

                to:contract,

                data:callData

            },

            "latest"

        ]

    );

    const usdtBalance=

        Number(BigInt(tokenHex))/
        Math.pow(10,decimals);

    addResult(

        network,

        "USDT",

        address,

        usdtBalance

    );

    return usdtBalance;

}

/* =========================
   بررسی TRON
========================= */

async function checkTRON(address){

    if(!/^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(address)){

        throw new Error("آدرس TRON نامعتبر است");

    }

    const apiKey=
        document.getElementById("tronKey").value.trim();

    const headers={};

    if(apiKey){

        headers["TRON-PRO-API-KEY"]=apiKey;

    }

    /* موجودی TRX */

    const accountData=await getJSON(

        "https://api.trongrid.io/v1/accounts/"+
        encodeURIComponent(address),

        {headers:headers}

    );

    if(!Array.isArray(accountData.data)||
       accountData.data.length===0){

        throw new Error("اطلاعات حساب TRON دریافت نشد");

    }

    const account=accountData.data[0];

    const trxBalance=
        Number(account.balance||0)/1e6;

    addResult(

        "TRON",

        "TRX",

        address,

        trxBalance

    );

    /* موجودی USDT TRC20 */

    const tokenURL=

        "https://api.trongrid.io/v1/accounts/"+
        encodeURIComponent(address)+
        "/tokens?limit=200&contract_address="+
        encodeURIComponent(CONTRACTS.TRON_USDT);

    const tokenData=await getJSON(

        tokenURL,

        {headers:headers}

    );

    if(!Array.isArray(tokenData.data)){

        throw new Error("پاسخ USDT ترون نامعتبر است");

    }

    let usdtBalance=0;

    for(const token of tokenData.data){

        const tokenAddress=

            token.token_id||
            token.address||
            token.contract_address||
            "";

        if(

            tokenAddress.toLowerCase()===
            CONTRACTS.TRON_USDT.toLowerCase()

        ){

            const decimals=
                Number(token.token_decimals??6);

            usdtBalance=

                Number(BigInt(token.balance||"0"))/
                Math.pow(10,decimals);

            break;

        }

    }

    addResult(

        "TRON",

        "USDT",

        address,

        usdtBalance

    );

    return usdtBalance;

}

/* =========================
   اجرای بررسی هر شبکه
========================= */

async function runCheck(network,address,fn){

    try{

        document.getElementById("status").textContent=

            "در حال بررسی "+network+" ...";

        const balance=await fn(address);

        return {

            network:network,

            success:true,

            balance:balance

        };

    }catch(error){

        return {

            network:network,

            success:false,

            error:error.message

        };

    }

}

/* =========================
   شروع بررسی
========================= */

async function run(){

    const word=
        document.getElementById("word").value.trim();

    const position=
        document.getElementById("position").value;

    const addresses={

        BTC:document.getElementById("btc").value.trim(),

        ETH:document.getElementById("eth").value.trim(),

        BNB:document.getElementById("bnb").value.trim(),

        TRON:document.getElementById("tron").value.trim()

    };

    if(!Object.values(addresses).some(Boolean)){

        document.getElementById("status").textContent=

            "حداقل یک آدرس عمومی وارد کنید.";

        return;

    }

    const button=document.getElementById("start");

    button.disabled=true;

    const tasks=[];

    if(addresses.BTC){

        tasks.push(

            runCheck(
                "Bitcoin",
                addresses.BTC,
                checkBTC
            )

        );

    }

    if(addresses.ETH){

        tasks.push(

            runCheck(
                "Ethereum",
                addresses.ETH,
                a=>checkEVM(a,"Ethereum")
            )

        );

    }

    if(addresses.BNB){

        tasks.push(

            runCheck(
                "BNB Smart Chain",
                addresses.BNB,
                a=>checkEVM(a,"BNB")
            )

        );

    }

    if(addresses.TRON){

        tasks.push(

            runCheck(
                "TRON",
                addresses.TRON,
                checkTRON
            )

        );

    }

    document.getElementById("status").textContent=

        "بررسی شروع شد...";

    try{

        const results=await Promise.all(tasks);

        let output="نتیجه بررسی:\n\n";

        results.forEach(result=>{

            if(result.success){

                output+=
                    result.network+
                    ": بررسی موفق بود.\n";

            }else{

                output+=
                    result.network+
                    ": خطا — "+
                    result.error+
                    "\n";

            }

        });

        output+="\nبررسی پایان یافت.";

        document.getElementById("status").textContent=output;

    }finally{

        button.disabled=false;

    }

}

/* =========================
   پاک کردن تاریخچه
========================= */

function clearHistory(){

    if(confirm("تمام تاریخچه پاک شود؟")){

        history=[];

        saveHistory();

        render();

        document.getElementById("status").textContent=

            "تاریخچه پاک شد.";

    }

}

/* =========================
   دانلود CSV
========================= */

function downloadCSV(){

    if(history.length===0){

        document.getElementById("status").textContent=

            "تاریخچه خالی است.";

        return;

    }

    const rows=[

        [

            "Word",

            "Position",

            "Network",

            "Asset",

            "Address",

            "Balance",

            "Date"

        ],

        ...history.map(x=>[

            x.word,

            x.position,

            x.network,

            x.asset,

            x.address,

            x.balance,

            x.date

        ])

    ];

    const quote=value=>

        '"'+String(value??"").replace(/"/g,'""')+'"';

    const csv=

        "\uFEFF"+

        rows.map(row=>

            row.map(quote).join(",")

        ).join("\r\n");

    const blob=new Blob(

        [csv],

        {type:"text/csv;charset=utf-8"}

    );

    const url=URL.createObjectURL(blob);

    const a=document.createElement("a");

    a.href=url;

    a.download="wallet-history.csv";

    a.click();

    URL.revokeObjectURL(url);

}

/* =========================
   اتصال دکمه‌ها
========================= */

document.getElementById("start").onclick=run;

document.getElementById("clear").onclick=clearHistory;

document.getElementById("csv").onclick=downloadCSV;

render();

</script>

</body>
</html>
